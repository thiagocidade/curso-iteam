<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=7, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <table border="1">
        <caption>Horário do curso</caption>
        <thead>
            <tr>
                <th>Horários</th>
                <th>Seg</th>
                <th>Ter</th>
                <th>Qua</th>
                <th>Qui</th>
                <th>Sex</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>08:00</td>
                <td>HTML</td>
                <td>CSS</td>
                <td rowspan="2">PROJETO</td>
                <td>HTML</td>
                <td>CSS</td>
            </tr>
            <tr>
                <td>09:00</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>JS</td>
                <td>JS</td>
            </tr>
            <tr>
                <td>10:00</td>
                <td colspan="5"><center>INTERVALO</center></td>
            </tr>
            <tr>
                <td>10:30</td>
                <td>JS</td>
                <td>JS</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>PROJETO</td>
            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
